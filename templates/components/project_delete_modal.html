<button type="button"
        class="button button-danger"
        popovertarget="delete-project-{{ project.pk }}"
        aria-haspopup="dialog"
        aria-label="Hapus {{ project.title }}">
    Hapus proyek
</button>

<div id="delete-project-{{ project.pk }}"
     class="project-delete-modal"
     popover="auto"
     role="dialog"
     aria-labelledby="delete-project-title-{{ project.pk }}"
     aria-describedby="delete-project-description-{{ project.pk }}">
    <button type="button"
            class="project-delete-modal__backdrop"
            popovertarget="delete-project-{{ project.pk }}"
            popovertargetaction="hide"
            aria-label="Tutup konfirmasi hapus"
            tabindex="-1"></button>

    <div class="project-delete-modal__content">
        <button type="button"
                class="project-delete-modal__close"
                popovertarget="delete-project-{{ project.pk }}"
                popovertargetaction="hide"
                aria-label="Tutup konfirmasi hapus">&times;</button>

        <h2 id="delete-project-title-{{ project.pk }}">Hapus proyek?</h2>
        <p id="delete-project-description-{{ project.pk }}">
            Kamu akan menghapus <strong>{{ project.title }}</strong>.
            Data yang dihapus tidak dapat dikembalikan melalui halaman ini.
        </p>

        <div class="project-delete-modal__actions">
            <button type="button"
                    class="button button-secondary"
                    popovertarget="delete-project-{{ project.pk }}"
                    popovertargetaction="hide"
                    autofocus>Batal</button>

            <form method="post" action="{% url 'main:delete_project' project.pk %}">
                {% csrf_token %}
                <button type="submit" class="button button-danger">Ya, hapus</button>
            </form>
        </div>
    </div>
</div>
