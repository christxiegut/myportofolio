<div id="add-project-modal" class="project-form-modal" popover="auto"
     role="dialog" aria-labelledby="add-project-modal-title">
    <button type="button" class="project-form-modal__backdrop" tabindex="-1"
            popovertarget="add-project-modal" popovertargetaction="hide"
            aria-label="Tutup form tambah proyek"></button>
    <div class="project-form-modal__content">
        <button type="button" class="project-form-modal__close"
                popovertarget="add-project-modal" popovertargetaction="hide"
                aria-label="Tutup form tambah proyek">&times;</button>
        <p class="section-kicker">Satu karya, satu cerita baru</p>
        <h2 id="add-project-modal-title">Tambah proyek</h2>
        <form id="project-form" method="post" action="{% url 'main:create_project' %}"
              class="project-form">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    <p class="form-error" id="ajax-error-{{ field.name }}" hidden></p>
                </div>
            {% endfor %}
            <p id="project-form-error" class="form-error" role="alert" hidden></p>
            <div class="project-form-modal__actions">
                <button type="button" class="button button-secondary"
                        popovertarget="add-project-modal" popovertargetaction="hide">Batal</button>
                <button type="submit" class="button">Tambah proyek</button>
            </div>
        </form>
    </div>
</div>
