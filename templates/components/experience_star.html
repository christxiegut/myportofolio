{% with stars=experience.starred_by.all %}
<form method="post" action="{% url 'main:toggle_experience_star' experience.pk %}" class="star-form">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    <button type="submit" class="button button-star{% if user in stars %} is-starred{% endif %}"
            aria-pressed="{% if user in stars %}true{% else %}false{% endif %}"
            aria-label="{% if user in stars %}Batalkan star untuk{% else %}Beri star untuk{% endif %} {{ experience.title }}"
            title="{% if stars %}Dibintangi oleh {{ stars|join:', ' }}{% else %}Jadilah yang pertama memberi star{% endif %}">
        <span aria-hidden="true">★</span>
        {% if user in stars %}Unstar{% else %}Star{% endif %}
        <span class="star-count">{{ stars|length }}</span>
    </button>
</form>
{% endwith %}
